version: 1
repo: design-system
owner: design-system
path: design-system
release_group: ops_preview
owns:
  - shared_visual_language
  - tokens
source_of_truth:
  repo_contract: repo.yaml
  http_contracts: []
  cli_contracts: []
  shared_contracts:
    - STYLE.md
    - MOBILE.md
    - BLOG.md
    - CONSUMERS.md
  runtime_contracts: []
  chain_contracts: []
code_map:
  - path: regent_ui
    owns: regent_ui
  - path: scripts/render-structure-showcase.exs
    owns: structural_showcase
shared_api:
  catalog: "STYLE.md, section Shared compositions: every public regent_ui component, its purpose and its consumers"
local_path_dependencies: []
acceptance_commands:
  - cwd: design-system/regent_ui
    command: mix check
  - cwd: design-system/regent_ui
    command: mix run ../scripts/render-structure-showcase.exs
